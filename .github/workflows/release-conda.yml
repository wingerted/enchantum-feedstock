name: Release Conda Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.76.2
          locked: true
      - name: Build and test linux-64 package
        run: pixi run build
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-64
          path: output/linux-64/*.conda
      - uses: softprops/action-gh-release@v2
        with:
          files: output/linux-64/*.conda
          generate_release_notes: true
      - name: Upload package to cxxlibs
        run: |
          for file in output/linux-64/*.conda; do
            pixi run rattler-build upload prefix --channel cxxlibs "$file"
          done
