context:
  version: 0.5.0

package:
  name: enchantum
  version: ${{ version }}

source:
  url: https://github.com/ZXShady/enchantum/archive/refs/tags/${{ version }}.tar.gz
  sha256: 654d43f6a88f6555d3cad80e9ce3e72e1346be5617c678b4ef10a06a77d7d647

build:
  script:
    - cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_PREFIX="$PREFIX"
    - cmake --install build

requirements:
  build:
    - clangxx
    - cmake
    - ninja

tests:
  - package_contents:
      include:
        - enchantum/enchantum.hpp
      files:
        - share/enchantum/cmake/enchantumConfig.cmake
        - share/enchantum/cmake/enchantumTargets.cmake

about:
  homepage: https://github.com/ZXShady/enchantum
  license: MIT
  license_file: LICENSE
  summary: Header-only C++ enum reflection
